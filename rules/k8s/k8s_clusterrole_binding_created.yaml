name: k8s-clusterrole-binding-created
description: Detects creation of ClusterRoleBindings - may indicate privilege escalation especially if binding cluster-admin
severity: critical
nats_subject: samma.alerts.k8s.clusterrole_binding_created

compliance:
  pci_dss:
    - "10.2.2"
    - "10.2.5"
    - "7.1.2"
  gdpr:
    - "IV_35.7.d"
  hipaa:
    - "164.312.a"
  nist_800_53:
    - "AC.2"
    - "AC.6"
    - "AU.14"
  mitre:
    - "T1098.006"
    - "T1078"
  tsc:
    - "CC6.1"
    - "CC6.3"
    - "CC7.2"
  gpg13:
    - "7.1"
    - "7.2"

match:
  and:
    - field: kind
      equals: Event
    - field: verb
      equals: create
    - or:
        - field: objectRef.resource
          equals: clusterrolebindings
        - field: objectRef.resource
          equals: rolebindings

name: k8s-deployment-deleted
description: Detects deletion of deployments, statefulsets, or daemonsets - potential data destruction or service disruption
severity: high
nats_subject: samma.alerts.k8s.deployment_deleted

compliance:
  pci_dss:
    - "10.2.2"
    - "10.2.7"
  nist_800_53:
    - "AU.14"
    - "CP.10"
    - "IR.6"
  mitre:
    - "T1485"
  tsc:
    - "CC7.2"
    - "CC7.3"
    - "A1.2"
  gpg13:
    - "7.1"

match:
  and:
    - field: kind
      equals: Event
    - field: verb
      equals: delete
    - or:
        - field: objectRef.resource
          equals: deployments
        - field: objectRef.resource
          equals: statefulsets
        - field: objectRef.resource
          equals: daemonsets

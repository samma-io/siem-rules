name: k8s-event-deleted
description: Detects deletion of Kubernetes events - may indicate an attacker covering their tracks
severity: critical
nats_subject: samma.alerts.k8s.event_deleted

compliance:
  pci_dss:
    - "10.2.2"
    - "10.7"
  nist_800_53:
    - "AU.9"
    - "AU.14"
    - "IR.6"
  mitre:
    - "T1070"
  tsc:
    - "CC7.2"
    - "CC7.3"
    - "CC7.4"
  gpg13:
    - "7.1"
    - "7.2"

match:
  and:
    - field: kind
      equals: Event
    - field: objectRef.resource
      equals: events
    - or:
        - field: verb
          equals: delete
        - field: verb
          equals: deletecollection

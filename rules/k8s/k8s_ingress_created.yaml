name: k8s-ingress-created
description: Detects creation of Ingress resources which expose services externally
severity: medium
nats_subject: samma.alerts.k8s.ingress_created

compliance:
  pci_dss:
    - "1.2.1"
    - "10.2.7"
  nist_800_53:
    - "SC.7"
    - "CM.3"
  mitre:
    - "T1133"
  tsc:
    - "CC6.1"
    - "CC6.6"
  gpg13:
    - "7.1"

match:
  and:
    - field: kind
      equals: Event
    - field: objectRef.resource
      equals: ingresses
    - field: verb
      equals: create

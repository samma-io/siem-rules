name: k8s-pod-exec
description: Detects command execution inside a running pod via kubectl exec - indicates lateral movement or container administration
severity: high
nats_subject: samma.alerts.k8s.pod_exec

compliance:
  pci_dss:
    - "10.2.2"
    - "10.2.5"
  gdpr:
    - "IV_35.7.d"
  hipaa:
    - "164.312.b"
  nist_800_53:
    - "AU.14"
    - "AC.17"
    - "IR.6"
  mitre:
    - "T1609"
  tsc:
    - "CC6.1"
    - "CC7.2"
    - "CC7.3"
  gpg13:
    - "7.1"
    - "7.2"

match:
  and:
    - field: kind
      equals: Event
    - field: objectRef.resource
      equals: pods
    - field: objectRef.subresource
      equals: exec
    - field: verb
      equals: create

name: k8s-secret-modified
description: Detects creation, update, or deletion of secrets - may indicate credential tampering or exfiltration setup
severity: high
nats_subject: samma.alerts.k8s.secret_modified

compliance:
  pci_dss:
    - "10.2.1"
    - "10.2.5"
    - "8.1.2"
  gdpr:
    - "IV_35.7.d"
    - "IV_32.2"
  hipaa:
    - "164.312.a"
    - "164.312.d"
  nist_800_53:
    - "AC.3"
    - "AU.14"
    - "SC.28"
  mitre:
    - "T1552.007"
  tsc:
    - "CC6.1"
    - "CC6.8"
  gpg13:
    - "7.1"
    - "7.2"

match:
  and:
    - field: kind
      equals: Event
    - field: objectRef.resource
      equals: secrets
    - or:
        - field: verb
          equals: create
        - field: verb
          equals: update
        - field: verb
          equals: patch
        - field: verb
          equals: delete

name: k8s-service-account-created
description: Detects creation of new service accounts which could be used for persistence or privilege escalation
severity: medium
nats_subject: samma.alerts.k8s.service_account_created

compliance:
  pci_dss:
    - "10.2.5"
    - "8.1.2"
  gdpr:
    - "IV_35.7.d"
  hipaa:
    - "164.312.a"
  nist_800_53:
    - "AC.2"
    - "AU.12"
  mitre:
    - "T1136"
  tsc:
    - "CC6.1"
    - "CC6.2"
  gpg13:
    - "7.1"

match:
  and:
    - field: kind
      equals: Event
    - field: objectRef.resource
      equals: serviceaccounts
    - field: verb
      equals: create
